# b002: b001's question with rung-scaled gates and 2.5x the budget.
# Pre-registered 2026-09-24, after b001 closed and before b002 ran.
# See notes/2026-09-24-b002-design.md.
batch_id: b002-student-size-longer
task: Mjlab-VelStand-Flat-MicroDuck
teacher: teachers/velstand.onnx
teacher_source: pollen-robotics/microduck-policies@1b56c396825c052a4e26e95cf2b8d8298af9e9b4/velstand.onnx
num_envs: 512
seed: 0
eta: 2
rank: efficiency
judge:
  models: [decide, jev]
  act: [jev]
rungs:
  - {iters: 150}
  - {iters: 300}
  - {iters: 600}
train:
  steps_per_iter: 24
  grad_steps: 20
  beta0: 1.0
  beta_decay_iters: 40
eval:
  rung_seconds: 20
  recover_seconds: 6
  rung_seed: 1000
  final_seconds: 30
  final_seeds: [2001, 2002, 2003]
# Early rungs kill only the catastrophic; everything else competes on rank for the quota.
# The DEFAULT_GATES (unchanged from b001) apply at the final rung.
gates_early:
  falls_kill_abs: 8.0
  down_kill: 0.25
  lin_kill_ratio: 3.0
  ang_kill_ratio: 3.0
  recover_kill_drop: 0.50
arms:
  - {id: a01, hidden: [256, 128, 64]}
  - {id: a02, hidden: [128, 128]}
  - {id: a03, hidden: [128, 64]}
  - {id: a04, hidden: [64, 64]}
  - {id: a05, hidden: [64, 32]}
  - {id: a06, hidden: [32, 32]}
