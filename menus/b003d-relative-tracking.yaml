# b003d: b003b with the linear tracking term judged relative to the command.
# Pre-registered 2026-10-01, before any run. See notes/2026-10-01-b003d-design.md.
batch_id: b003d-relative-tracking
task: Mjlab-VelStand-Flat-MicroDuck
teacher: teachers/velstand.onnx
student: records/b002-student-size-longer/policies/a02/policy.onnx   # 61-128-128-14, 26,254 params
seed: 0
eval_envs: 512
final_seeds: [2001, 2002, 2003]
finetune:
  num_envs: 2048            # HF Jobs l4x1 (24 GB): VelStand is ~6 MB of contact buffers per env; the laptop tops out at 512
  iterations: 1500
  save_interval: 250
  init_std: 0.25            # small: the student already walks
  learning_rate: 3.0e-4
  entropy_coef: 0.002
  command:
    rel_turn_in_place_envs: 0.25   # VelStand's own switch; it trains with 0.15
    rel_standing_envs: 0.25        # VelStand's standing_envs curriculum holds 0.25 at every reset; b003-b003c's 0.05 never applied
  rewards:                   # the one change from b003b, half 1: mjlab's linear tracking term off ...
    track_linear_velocity: {weight: 0.0}
  add_rewards:
    track_linear_velocity_relative:   # ... half 2: the same term, width scaled by the command below 0.4 m/s
      func: duckbatch.rewards.track_linear_velocity_relative
      weight: 2.0                     # mjlab's weight
      params: {command_name: twist, std: 0.31622776601683794, full_width_speed: 0.4,
               min_width_speed: 0.05, stand_below: 0.02}   # std: mjlab's √0.1
    command_progress_linear:
      func: duckbatch.rewards.command_progress_linear
      weight: 1.0
      params: {command_name: twist, min_command: 0.02}
    command_progress_angular:
      func: duckbatch.rewards.command_progress_angular
      weight: 1.0
      params: {command_name: twist, min_command: 0.1}
  anchor:
    gate_tilt_deg: 35.0     # fallen frames: the teacher's recovery, fully
    coef_fallen: 1.0
    walk_min_speed: 0.35    # upright at or above this, or standing still: a light pull
    coef_walk: 0.2
    learning_rate: 3.0e-4
    epochs: 1
    mini_batches: 4
